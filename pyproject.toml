[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ru-name-anonymizer"
version = "1.0.0"
description = "Анонимизация русских имён, отчеств и фамилий без ML и тяжёлых зависимостей"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT AND CC-BY-SA-3.0"
license-files = ["LICENSE", "DATA-LICENSE.md"]
keywords = ["russian", "anonymization", "names", "nlp", "pii"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: Russian",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/HACER777BEBRA/ru-name-anonymizer"
Source = "https://github.com/HACER777BEBRA/ru-name-anonymizer"
Issues = "https://github.com/HACER777BEBRA/ru-name-anonymizer/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ru_name_anonymizer = ["py.typed"]
"*" = ["*.txt"]  # словари локалей: locales/<код>/*.txt

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
